<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatControl</title>
<meta name="description" content="Chat Control Dossier — status, technical analysis, protection manual and civic action, in French, English, German, Italian and Spanish.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d1321">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .lang-landing{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(155deg, #0d1321 0%, #182236 55%, #0d1321 100%);
    padding: 32px 20px;
  }
  .lang-landing::before{
    content:""; position:fixed; inset:0; opacity:0.4; pointer-events:none;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  }
  .lang-card{
    position:relative; max-width:560px; width:100%; text-align:center;
  }
  .lang-stamp{
    font-family: var(--mono); font-size:0.7rem; letter-spacing:2px; color: var(--gold);
    text-transform:uppercase; display:inline-flex; align-items:center; gap:8px; margin-bottom:20px;
  }
  .lang-stamp::before{ content:""; width:8px; height:8px; border-radius:50%; background: var(--alert); box-shadow: 0 0 0 3px rgba(179,18,43,0.25); }
  .lang-title{
    font-family: var(--serif); font-weight:700; color:#efe9d6; font-size: clamp(1.5rem, 4vw, 2.1rem);
    margin: 0 0 10px; min-height: 2.6em; transition: opacity .18s ease;
  }
  .lang-sub{
    color:#aab0c2; font-size:0.95rem; margin: 0 0 34px; line-height:1.7; min-height: 3.4em;
    transition: opacity .18s ease;
  }
  .lang-title.fading, .lang-sub.fading{ opacity:0; }
  .lang-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (min-width: 480px){ .lang-grid{ grid-template-columns: 1fr 1fr 1fr; } }
  .lang-option{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.16); border-radius:5px;
    padding: 20px 14px; text-decoration:none; transition: all .18s ease;
  }
  .lang-option:hover, .lang-option:focus-visible{ border-color: var(--gold); background: rgba(166,128,46,0.12); transform: translateY(-2px); }
  .lang-option .flag{ font-size:1.7rem; line-height:1; }
  .lang-option .native{ font-family: var(--serif); font-weight:700; color:#efe9d6; font-size:1.02rem; }
  .lang-option .hint{ font-family: var(--mono); font-size:0.68rem; color:#8b91a6; letter-spacing:0.4px; }
  .lang-option.suggested{ border-color: var(--gold); background: rgba(166,128,46,0.1); }
  .lang-footer{ margin-top:30px; font-family: var(--mono); font-size:0.72rem; color:#6b7186; }
  .lang-footer a{ color:#8b91a6; }
</style>
</head>
<body>
<div class="lang-landing">
  <div class="lang-card">
    <span class="lang-stamp" id="lang-stamp">Chat Control Dossier</span>
    <h1 class="lang-title" id="lang-title">Choose your language</h1>
    <p class="lang-sub" id="lang-sub">
      Legal status, technical dossier, protection manual and civic action.
    </p>
    <div class="lang-grid" id="lang-grid">
      <a class="lang-option" data-lang="fr" href="home.html?lang=fr">
        <span class="flag">🇫🇷</span><span class="native">Français</span><span class="hint">Continuer</span>
      </a>
      <a class="lang-option" data-lang="en" href="home.html?lang=en">
        <span class="flag">🇬🇧</span><span class="native">English</span><span class="hint">Continue</span>
      </a>
      <a class="lang-option" data-lang="de" href="home.html?lang=de">
        <span class="flag">🇩🇪</span><span class="native">Deutsch</span><span class="hint">Weiter</span>
      </a>
      <a class="lang-option" data-lang="it" href="home.html?lang=it">
        <span class="flag">🇮🇹</span><span class="native">Italiano</span><span class="hint">Continua</span>
      </a>
      <a class="lang-option" data-lang="es" href="home.html?lang=es">
        <span class="flag">🇪🇸</span><span class="native">Español</span><span class="hint">Continuar</span>
      </a>
    </div>
    <p class="lang-footer">github.com/NoKs-Git — <span id="lang-footer-tagline">independent civic dossier</span></p>
  </div>
</div>

<script>
(function () {
  var TXT = {
    fr: { title: 'Choisissez votre langue', sub: 'Statut légal, dossier technique, manuel de protection et actions citoyennes.', brand: 'Dossier Chat Control', footer: 'dossier civique indépendant' },
    en: { title: 'Choose your language', sub: 'Legal status, technical dossier, protection manual and civic action.', brand: 'Chat Control Dossier', footer: 'independent civic dossier' },
    de: { title: 'Wählen Sie Ihre Sprache', sub: 'Rechtsstatus, technisches Dossier, Schutzhandbuch und Bürgeraktionen.', brand: 'Chat-Control-Dossier', footer: 'unabhängiges Bürger-Dossier' },
    it: { title: 'Scegli la tua lingua', sub: 'Stato legale, dossier tecnico, manuale di protezione e azione civica.', brand: 'Dossier Chat Control', footer: 'dossier civico indipendente' },
    es: { title: 'Elige tu idioma', sub: 'Estado legal, dossier técnico, manual de protección y acción cívica.', brand: 'Dossier Chat Control', footer: 'dossier cívico independiente' }
  };

  var titleEl = document.getElementById('lang-title');
  var subEl = document.getElementById('lang-sub');
  var stampEl = document.getElementById('lang-stamp');
  var footerEl = document.getElementById('lang-footer-tagline');
  var grid = document.getElementById('lang-grid');
  var currentLang = 'en';

  function setText(lang) {
    var t = TXT[lang];
    if (!t) return;
    titleEl.classList.add('fading');
    subEl.classList.add('fading');
    setTimeout(function () {
      titleEl.innerHTML = t.title;
      subEl.innerHTML = t.sub;
      stampEl.textContent = t.brand;
      footerEl.textContent = t.footer;
      titleEl.classList.remove('fading');
      subEl.classList.remove('fading');
    }, 140);
  }

  function showLang(lang) {
    if (lang === currentLang) return;
    currentLang = lang;
    setText(lang);
  }

  // Show the default (English) text immediately on load, no fade needed here.
  titleEl.innerHTML = TXT.en.title;
  subEl.innerHTML = TXT.en.sub;
  stampEl.textContent = TXT.en.brand;
  footerEl.textContent = TXT.en.footer;

  if (grid) {
    grid.querySelectorAll('.lang-option').forEach(function (opt) {
      var lang = opt.getAttribute('data-lang');
      opt.addEventListener('mouseenter', function () { showLang(lang); });
      opt.addEventListener('focus', function () { showLang(lang); });
      // Deliberately no mouseleave/blur handler: the preview keeps showing
      // whichever language box the mouse last passed over.
    });
  }

  // Progressive enhancement only: highlight the browser's language as a suggestion.
  // Every option above is a plain <a href> already, so the page works with JS disabled.
  try {
    var supported = ['fr', 'en', 'de', 'it', 'es'];
    var nav = (navigator.language || 'fr').substring(0, 2).toLowerCase();
    if (supported.indexOf(nav) !== -1) {
      var el = document.querySelector('.lang-option[data-lang="' + nav + '"]');
      if (el) el.classList.add('suggested');
    }
  } catch (e) {}
})();
</script>
</body>
</html>
